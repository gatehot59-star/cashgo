name: fase0

on:
  push:
    branches: ["main", "titan/**"]
  pull_request:
    branches: ["main"]

# D2 (hallazgo del auditor externo, 2026-09-07): antes esto era UN job secuencial,
# y el paso de custodia (inventario + diff del CSV) estaba ANTES de la suite. En el
# head de13b9a6 un CSV desactualizado por una linea puso todo en rojo y dejo la
# suite, el control positivo, el pipeline y los modelos en `skipped`: un defecto
# DOCUMENTAL ciego la verificacion del CODIGO entero, y durante horas no se supo si
# las ocho correcciones B1-B8 funcionaban.
#
# Ahora hay un job por PREGUNTA:
#   custodia    -> los recibos describen este arbol?  (documental)
#   suite       -> el codigo funciona?                (funcional)
#   dependencias-> hay CVEs en el arbol de deps?      (seguridad, no determinista)
#   secretos    -> hay credenciales en el historial?  (seguridad, determinista)
#
# LOS DOS DE SEGURIDAD ESTABAN EN UN SOLO JOB Y DURO UNA CORRIDA. Dio `failure` y
# el veredicto no decia CUAL de los dos habia fallado: para saberlo hacia falta
# abrir el log, o peor, adivinar. Es el MISMO defecto que llevo a partir el job
# original (D2), una capa mas abajo y cometido por mi doce minutos despues de
# corregirlo arriba. Un job que agrupa dos preguntas devuelve media respuesta.
#
# Ahora cada control tiene su job, y ademas son de naturaleza distinta, que es la
# razon de fondo para no mezclarlos: `dependencias` consulta una base de datos viva
# y puede ponerse rojo manana sin que nadie toque una linea; `secretos` es
# determinista sobre un historial dado. Confundir esos dos rojos es confundir
# "aparecio un CVE" con "alguien filtro una credencial".

jobs:
  custodia:
    name: custodia (recibos vs arbol)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Sin dependencias: los tres instrumentos de custodia son stdlib pura. Eso
      # es deliberado, asi un fallo de custodia nunca puede ser un fallo de pip.
      - name: Inventario estructural (guard propio)
        run: python3 scripts/inventario.py

      # D1: `--csv` ahora manda los mensajes de guard a stderr, asi que stdout es
      # un CSV valido y el diff compara CSV contra CSV. Antes los dos lados
      # traian la linea "GUARD VERDE" adentro del CSV y el diff pasaba igual:
      # un guard que compara dos copias del mismo error.
      - name: Diff del inventario contra la evidencia commiteada
        run: python3 scripts/inventario.py --csv | diff -u evidencia/inventario.csv -

      # Cierra "informe != CSV" por construccion: la fila TOTAL del dossier tiene
      # que salir del CSV, no de los dedos de quien lo escribio.
      - name: La tabla del informe sale del CSV
        run: python3 scripts/informe_vs_csv.py

      # "Canonizado" como propiedad verificable y no como declaracion.
      - name: Manifiesto de evidencia
        run: python3 scripts/manifiesto.py --verificar

  suite:
    name: suite (el codigo funciona)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # WeasyPrint necesita las libs nativas de Pango/Cairo. Sin esto el import
      # falla con un error de ctypes que no menciona a WeasyPrint y se pierden
      # veinte minutos buscando en el lugar equivocado.
      - name: Dependencias nativas de WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8 fonts-dejavu-core

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r fase0/requirements.txt

      - name: Generar fixtures (datos de prueba como codigo)
        run: python -m fase0.fixtures.generar

      # Ninguna de las dos tandas toca la red: el pipeline corre contra fixture y
      # el modelo se reemplaza por un clasificador de reglas. Es la propiedad que
      # hace que este CI sea util en un fork y en un PR de alguien de afuera.
      - name: Suite (128 tests, sin red)
        run: python -m unittest discover -s fase0/tests -t . -v

      # D3: el script se niega a arrancar si el arbol esta sucio en los archivos
      # que muta. En el runner el checkout esta limpio y los fixtures generados
      # arriba estan en .gitignore, asi que este guard no puede dar falso rojo.
      - name: Control positivo (7 mutaciones, cada una por su test)
        run: bash scripts/control_positivo_suite.sh

      - name: Pipeline end to end + PDF
        run: |
          python -m fase0.pipeline fase0/fixtures/brief_ejemplo.json \
            --dry-run fase0/fixtures/ads_archive_sample.json \
            --salida artefactos --pdf

      - name: Modelo de costo y reconciliacion del prefijo
        run: |
          python scripts/modelo_costo_arq3.py
          python scripts/sensibilidad_infra_y_equipo.py

      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-ejemplo
          path: artefactos/
          retention-days: 14

  dependencias:
    name: dependencias (CVEs) - BLOQUEANTE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Sin `continue-on-error`: este paso ES un porton.
      #
      # MEDICION PREVIA de las tres dependencias DIRECTAS (2026-09-07, en vivo):
      #   pydantic 2.13.4 .... sin vulnerabilidades conocidas
      #   weasyprint 69.0 .... es LA VERSION QUE ARREGLA CVE-2026-49452
      #                        (inyeccion de CSS via presentational hints, <= 68.1)
      #   pypdf 6.14.2 ....... es LA VERSION QUE ARREGLA CVE-2026-59935
      #                        (bucle infinito ASCII85/ASCIIHex, < 6.14.2, CVSS 8.7)
      #
      # Y LO QUE ESA MEDICION NO CUBRIO, que es el hueco que este job existe para
      # tapar: pip-audit audita el ARBOL COMPLETO de dependencias, no las tres
      # directas. weasyprint arrastra tinycss2, cssselect2, pyphen, fonttools y
      # pydyf; pydantic arrastra pydantic-core, annotated-types y typing-extensions.
      # Un CVE en cualquiera de esas es un CVE de este proyecto, y yo verifique tres
      # paquetes y hable como si hubiera verificado el conjunto. Este job es lo
      # unico que mide el conjunto.
      #
      # `--strict` incluido a proposito: si pip-audit no puede resolver o auditar
      # alguna dependencia, eso es un NO MEDIDO y un NO MEDIDO no puede pasar por
      # verde en un porton de seguridad.
      - name: pip-audit sobre el arbol completo de dependencias
        run: |
          pip install pip-audit
          pip-audit -r fase0/requirements.txt --strict

  secretos:
    name: secretos (historial completo) - BLOQUEANTE
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 NO es opcional: con la profundidad por defecto (1) el escaneo
      # solo ve el arbol del ultimo commit, asi que un secreto commiteado y borrado
      # despues sigue vivo en el historial y el escaneo lo da por limpio.
      # Un secreto filtrado NO se desfiltra: hay que buscarlo donde quedo.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Sin `continue-on-error`: este paso ES un porton.
      #
      # MEDICION PREVIA (2026-09-07): escaneo propio con 13 reglas de alta senal de
      # gitleaks (PAT de GitHub clasico y fine-grained, tokens de app/OAuth, AWS,
      # OpenAI, Slack, Google, Stripe, bloques de clave privada, JWT, token de Meta
      # y asignacion generica de api_key/secret/token/password) sobre los 44
      # archivos del ARBOL: cero hallazgos. Con control positivo: un canario
      # `sk-...` de 32 caracteres fue cazado por dos reglas, asi que el escaneo era
      # falsable y no un adorno.
      #
      # LIMITE de esa medicion, y la razon de este paso: cubrio el ARBOL, no el
      # HISTORIAL. Este paso es el unico que mira los 30 commits.
      - name: gitleaks sobre los 30 commits
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
