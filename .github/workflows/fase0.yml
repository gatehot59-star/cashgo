name: fase0

on:
  push:
    branches: ["main", "titan/**"]
  pull_request:
    branches: ["main"]

# D2 (hallazgo del auditor externo, 2026-09-07): antes esto era UN job secuencial,
# y el paso de custodia (inventario + diff del CSV) estaba ANTES de la suite. En el
# head de13b9a6 un CSV desactualizado por una linea puso todo en rojo y dejo la
# suite, el control positivo, el pipeline y los modelos en `skipped`: un defecto
# DOCUMENTAL ciego la verificacion del CODIGO entero, y durante horas no se supo si
# las ocho correcciones B1-B8 funcionaban.
#
# Ahora son TRES jobs independientes y en paralelo, uno por PREGUNTA:
#   custodia   -> los recibos describen este arbol?   (documental)
#   suite      -> el codigo funciona?                 (funcional)
#   seguridad  -> hay CVEs o secretos?                (seguridad)
#
# El tercero se separo al volverlo bloqueante, por el mismo razonamiento que llevo
# a partir el primero: un CVE nuevo publicado manana puede poner `seguridad` en
# rojo sin que nadie toque una linea, y ese rojo NO tiene que confundirse con
# "el codigo se rompio". Tres senales ortogonales, tres veredictos legibles.

jobs:
  custodia:
    name: custodia (recibos vs arbol)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Sin dependencias: los tres instrumentos de custodia son stdlib pura. Eso
      # es deliberado, asi un fallo de custodia nunca puede ser un fallo de pip.
      - name: Inventario estructural (guard propio)
        run: python3 scripts/inventario.py

      # D1: `--csv` ahora manda los mensajes de guard a stderr, asi que stdout es
      # un CSV valido y el diff compara CSV contra CSV. Antes los dos lados
      # traian la linea "GUARD VERDE" adentro del CSV y el diff pasaba igual:
      # un guard que compara dos copias del mismo error.
      - name: Diff del inventario contra la evidencia commiteada
        run: python3 scripts/inventario.py --csv | diff -u evidencia/inventario.csv -

      # Cierra "informe != CSV" por construccion: la fila TOTAL del dossier tiene
      # que salir del CSV, no de los dedos de quien lo escribio.
      - name: La tabla del informe sale del CSV
        run: python3 scripts/informe_vs_csv.py

      # "Canonizado" como propiedad verificable y no como declaracion.
      - name: Manifiesto de evidencia
        run: python3 scripts/manifiesto.py --verificar

  suite:
    name: suite (el codigo funciona)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # WeasyPrint necesita las libs nativas de Pango/Cairo. Sin esto el import
      # falla con un error de ctypes que no menciona a WeasyPrint y se pierden
      # veinte minutos buscando en el lugar equivocado.
      - name: Dependencias nativas de WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8 fonts-dejavu-core

      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r fase0/requirements.txt

      - name: Generar fixtures (datos de prueba como codigo)
        run: python -m fase0.fixtures.generar

      # Ninguna de las dos tandas toca la red: el pipeline corre contra fixture y
      # el modelo se reemplaza por un clasificador de reglas. Es la propiedad que
      # hace que este CI sea util en un fork y en un PR de alguien de afuera.
      - name: Suite (128 tests, sin red)
        run: python -m unittest discover -s fase0/tests -t . -v

      # D3: el script se niega a arrancar si el arbol esta sucio en los archivos
      # que muta. En el runner el checkout esta limpio y los fixtures generados
      # arriba estan en .gitignore, asi que este guard no puede dar falso rojo.
      - name: Control positivo (7 mutaciones, cada una por su test)
        run: bash scripts/control_positivo_suite.sh

      - name: Pipeline end to end + PDF
        run: |
          python -m fase0.pipeline fase0/fixtures/brief_ejemplo.json \
            --dry-run fase0/fixtures/ads_archive_sample.json \
            --salida artefactos --pdf

      - name: Modelo de costo y reconciliacion del prefijo
        run: |
          python scripts/modelo_costo_arq3.py
          python scripts/sensibilidad_infra_y_equipo.py

      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-ejemplo
          path: artefactos/
          retention-days: 14

  seguridad:
    name: seguridad (CVEs y secretos) - BLOQUEANTE
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 NO es opcional para gitleaks: con la profundidad por defecto
      # (1) solo ve el arbol del ultimo commit, y entonces un secreto commiteado y
      # despues borrado sigue vivo en el historial y el escaneo lo da por limpio.
      # Un secreto filtrado NO se desfiltra: hay que buscarlo donde quedo.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # AUDITORIA DE DEPENDENCIAS. Sin `continue-on-error`: este paso ahora ES un
      # porton y no un aviso.
      #
      # POR QUE SE PUEDE BLOQUEAR AHORA Y NO ANTES: hasta el 2026-09-07 su
      # resultado era NO MEDIDO, y volver bloqueante un control cuyo resultado no
      # se conoce es cambiar un adorno por una ruleta. Se midio primero, contra la
      # base de datos de vulnerabilidades, en vivo:
      #
      #   pydantic 2.13.4 .... sin vulnerabilidades conocidas
      #   weasyprint 69.0 .... es LA VERSION QUE ARREGLA CVE-2026-49452
      #                        (inyeccion de CSS via presentational hints; afecta
      #                        <= 68.1). Fuente: GHSA-jhhc-3hcp-qhm5
      #   pypdf 6.14.2 ....... es LA VERSION QUE ARREGLA CVE-2026-59935
      #                        (bucle infinito con inline images ASCII85/ASCIIHex
      #                        al extraer texto; afecta < 6.14.2, CVSS 8.7).
      #                        Fuente: GHSA-g867-7843-wf8q
      #
      # Los dos ultimos importan de verdad y no son casualidad: este pipeline
      # RENDERIZA HTML construido con texto de terceros (weasyprint) y despues
      # EXTRAE TEXTO de un PDF en los tests (pypdf). O sea que las dos rutas
      # afectadas son rutas que el codigo recorre.
      #
      # CONSECUENCIA DECLARADA, y es la razon del job aparte: este es el UNICO
      # paso del CI que no es determinista. Un CVE publicado manana pone el repo
      # en rojo sin que nadie toque una linea. Eso es exactamente lo que se quiere
      # de una auditoria de dependencias, y por eso su rojo no puede mezclarse con
      # el de la suite.
      - name: Auditoria de dependencias (pip-audit) - BLOQUEANTE
        run: |
          pip install pip-audit
          pip-audit -r fase0/requirements.txt --strict

      # ESCANEO DE SECRETOS. Sin `continue-on-error`.
      #
      # Medicion previa (2026-09-07): se corrio un escaneo propio con 13 reglas de
      # alta senal de gitleaks (PAT de GitHub clasico y fine-grained, tokens de
      # app/OAuth, AWS, OpenAI, Slack, Google, Stripe, bloques de clave privada,
      # JWT, token de Meta, y asignacion generica de api_key/secret/token/password)
      # sobre los 44 archivos del arbol: CERO hallazgos. Y con control positivo:
      # un canario `sk-...` de 32 caracteres fue cazado por dos reglas, asi que el
      # escaneo era falsable y no un adorno.
      #
      # LIMITE DECLARADO de esa medicion propia, y es la razon por la que este
      # paso hace falta igual: cubrio el ARBOL, no el HISTORIAL de los 30 commits.
      # Un secreto que entro y se borro despues no aparece en el arbol. Eso solo
      # lo puede ver gitleaks con fetch-depth 0, y su primer resultado sobre el
      # historial completo sigue siendo, honestamente, un estado no medido hasta
      # que este job corra.
      - name: Escaneo de secretos (gitleaks, historial completo) - BLOQUEANTE
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
