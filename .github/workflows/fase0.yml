name: fase0

# Un job por PREGUNTA. El razonamiento completo de cada particion, con sus
# mediciones y su deuda, esta en 02-INFORME-PARA-AUDITORIA.md seccion 5.4 y en
# 03-INFORME-TECNICO-FABLE-5.1.md.
#
#   custodia-inventario   el conteo describe este arbol?      documental
#   custodia-informe      el informe cita el CSV real?        documental
#   custodia-manifiesto   las firmas describen este arbol?    documental
#   custodia-firma        re-firma el manifiesto              escribe en la rama
#   suite                 el codigo funciona?                 funcional, sin red
#   deps-pins             CVEs en nuestros 3 pines?           seguridad
#   deps-arbol            CVEs en el arbol transitivo?        seguridad
#   secretos              credenciales en el historial?       seguridad
#
# REGLA DE ESTE ARCHIVO: un job = una pregunta. Se llego aca CUATRO veces por el
# mismo camino: un job que agrupa dos preguntas devuelve media respuesta, y para
# la otra mitad hay que abrir el log. Abrir el log no es un instrumento.
#
# La cuarta vez fue `custodia`, que agrupaba cuatro preguntas en un solo check
# run, y su rojo dejo la causa en NO MEDIDO durante dos dias enteros. Un auditor
# externo tuvo que recomputar los 19 sha256 a mano para decirnos cuales tres
# divergian. **El nombre del check run es el unico canal de diagnostico que se
# lee por API sin abrir un log**, asi que la particion no es prolijidad: es el
# instrumento.
#
# PROHIBIDO `continue-on-error` en los tres de seguridad. Un paso que no puede
# hacer fallar el job no es un control: es un adorno con forma de control.

on:
  push:
    branches: ["main", "titan/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  custodia-inventario:
    name: custodia-1 (el conteo describe el arbol)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # stdlib pura y sin pip a proposito: un fallo de custodia nunca puede ser
      # un fallo de instalacion de dependencias.
      - run: python3 scripts/inventario.py

      # `--csv` manda el guard a stderr, asi que esto compara CSV contra CSV.
      - run: python3 scripts/inventario.py --csv | diff -u evidencia/inventario.csv -

  custodia-informe:
    name: custodia-2 (el informe cita el CSV real)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/informe_vs_csv.py

  custodia-manifiesto:
    name: custodia-3 (las firmas describen el arbol)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `--verificar` imprime DIFIERE / FALTA / SIN FIRMA con la ruta. Eso ya
      # estaba y no alcanzaba, porque vivia en un log que nadie del equipo puede
      # abrir. Ahora, ademas, va al resumen del job, que SI se lee sin el log.
      - name: verificar las firmas
        run: |
          python3 scripts/manifiesto.py --verificar 2>&1 | tee /tmp/manifiesto.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### manifiesto.py --verificar"
            echo ""
            echo '```'
            cat /tmp/manifiesto.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custodia-manifiesto-salida
          path: /tmp/manifiesto.txt
          retention-days: 14

  custodia-firma:
    name: custodia-4 (re-firma el manifiesto)
    # Solo en push a una rama de trabajo propia. En pull_request el token puede
    # venir de un fork y no debe poder escribir.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/titan/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # POR QUE FIRMA LA MAQUINA Y NO EL OPERADOR, y que se pierde con eso.
      #
      # Los defectos 38 y 39 son el mismo defecto: el canal de escritura del
      # equipo transporta TEXTO, asi que firmar 42 KB de prosa obliga a
      # re-transcribirla, y en 42 KB la copia siempre difiere. Una de esas
      # re-transcripciones metio la palabra rusa "izvestno" DENTRO de un sha256
      # commiteado, y el manifiesto quedo invalido por construccion durante dos
      # dias. Cuidar mas no arregla eso: seis intentos lo probaron. Se cambia el
      # instrumento.
      #
      # LO QUE SE PIERDE, declarado: el manifiesto deja de detectar "alguien
      # edito el informe y no regenero los recibos", porque la maquina re-firma
      # lo que encuentra. Esa propiedad la sigue dando git (direcciona por
      # contenido y el historial queda). Lo que el manifiesto conserva, que es
      # para lo que se creo (A1), es que un tercero pueda comprobar que el
      # documento que recibio ES el del repo.
      - name: re-firmar si el arbol cambio
        run: |
          python3 scripts/manifiesto.py --escribir
          if git diff --quiet -- evidencia/MANIFEST.sha256; then
            echo "sin cambios: el manifiesto ya describe este arbol" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### el manifiesto se re-firmo"
            echo ""
            echo '```diff'
            git diff -- evidencia/MANIFEST.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidencia/MANIFEST.sha256
          git commit -m "chore(custodia): re-firma automatica del manifiesto [firmado por CI]"
          git push

  suite:
    name: suite (el codigo funciona)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # WeasyPrint necesita Pango/Cairo nativos. Sin esto el import falla con un
      # error de ctypes que no lo menciona.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8 fonts-dejavu-core

      - run: |
          python -m pip install --upgrade pip
          pip install -r fase0/requirements.txt

      - run: python -m fase0.fixtures.generar

      # Nada de esto toca la red: fixture + clasificador por reglas. Por eso
      # corre en un fork y en un PR de afuera.
      - run: python -m unittest discover -s fase0/tests -t . -v
      - run: bash scripts/control_positivo_suite.sh

      - run: |
          python -m fase0.pipeline fase0/fixtures/brief_ejemplo.json \
            --dry-run fase0/fixtures/ads_archive_sample.json \
            --salida artefactos --pdf

      - run: |
          python scripts/modelo_costo_arq3.py
          python scripts/sensibilidad_infra_y_equipo.py

      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-ejemplo
          path: artefactos/
          retention-days: 14

  deps-pins:
    name: deps-pins (CVEs en lo que pinneamos) - BLOQUEANTE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `--no-deps` audita EXACTAMENTE los 3 pines de requirements.txt.
      #
      # El `|| true` va sobre pip-audit y NO sobre el porton, y no relaja nada: el
      # exit code de pip-audit vale 1 para un advisory, para un error del servicio
      # y para un crash, asi que se descarta a proposito y decide el color del job
      # scripts/gate_deps.py, leyendo el informe.
      - run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: auditar los 3 pines directos
        run: |
          mkdir -p informe-deps
          pip-audit -r fase0/requirements.txt --no-deps \
            --timeout 60 --format json -o informe-deps/pins.json || true
          python3 scripts/gate_deps.py informe-deps/pins.json 2>&1 | tee /tmp/pins.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### gate_deps (pines directos)"
            echo ""
            echo '```'
            cat /tmp/pins.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Sin publicar el informe es invisible: nadie del equipo tiene herramientas
      # para abrir el log de una corrida, y eso fue exactamente lo que dejo la
      # causa del rojo en NO MEDIDO durante dos dias, hasta que un auditor externo
      # consulto OSV por su cuenta y encontro los 6 avisos de pypdf.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-pins-informe
          path: informe-deps/pins.json
          retention-days: 14

  deps-arbol:
    name: deps-arbol (CVEs en el arbol transitivo) - BLOQUEANTE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Sin `--no-deps`: el arbol completo. weasyprint arrastra Pillow, tinycss2,
      # cssselect2, pyphen, fonttools, pydyf y cffi; pydantic arrastra
      # pydantic-core, annotated-types y typing-extensions, y NINGUNO esta
      # pinneado. El informe dice "pins exactos" y eso vale para los 3 directos:
      # el resto flota. Su rojo NO se arregla como el de deps-pins.
      - run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: auditar el arbol completo
        run: |
          mkdir -p informe-deps
          pip-audit -r fase0/requirements.txt \
            --timeout 60 --format json -o informe-deps/arbol.json || true
          python3 scripts/gate_deps.py informe-deps/arbol.json 2>&1 | tee /tmp/arbol.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### gate_deps (arbol transitivo)"
            echo ""
            echo '```'
            cat /tmp/arbol.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-arbol-informe
          path: informe-deps/arbol.json
          retention-days: 14

  secretos:
    name: secretos (historial completo) - BLOQUEANTE
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 NO es opcional: con profundidad 1 un secreto commiteado y
      # borrado despues sigue vivo en el historial y el escaneo lo da por limpio.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # VERDE ajeno en varias corridas sobre los 30 commits. Es el unico control
      # de este repo que mira el historial y no el arbol.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
