name: fase0

# Un job por PREGUNTA. El razonamiento completo de cada particion, con sus
# mediciones y su deuda, esta en 02-INFORME-PARA-AUDITORIA.md seccion 5.4.
# Aca va solo lo que necesita quien viene a MODIFICAR este archivo.
#
#   custodia    los recibos describen este arbol?   documental
#   suite       el codigo funciona?                 funcional, sin red
#   deps-pins   CVEs en nuestros 3 pines?           seguridad, dueno claro
#   deps-arbol  CVEs en el arbol transitivo?        seguridad, no lo controlamos
#   secretos    credenciales en el historial?       seguridad, determinista
#
# REGLA DE ESTE ARCHIVO: un job = una pregunta. Se llego aca tres veces por el
# mismo camino: un job que agrupa dos preguntas devuelve media respuesta, y para
# la otra mitad hay que abrir el log. Abrir el log no es un instrumento.
#
# PROHIBIDO `continue-on-error` en los tres de seguridad. Un paso que no puede
# hacer fallar el job no es un control: es un adorno con forma de control.
#
# Los dos de deps deciden su color con `scripts/gate_deps.py`, que separa tres
# estados donde pip-audit da uno solo: verde / rojo de SEGURIDAD / rojo de
# INSTRUMENTO. El `|| true` sobre pip-audit no es una excepcion al parrafo de
# arriba: es descartar un exit code que no discrimina para que decida el que si.

on:
  push:
    branches: ["main", "titan/**"]
  pull_request:
    branches: ["main"]

jobs:
  custodia:
    name: custodia (recibos vs arbol)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # stdlib pura y sin pip a proposito: un fallo de custodia nunca puede ser
      # un fallo de instalacion de dependencias.
      - run: python3 scripts/inventario.py

      # `--csv` manda el guard a stderr, asi que esto compara CSV contra CSV.
      - run: python3 scripts/inventario.py --csv | diff -u evidencia/inventario.csv -

      - run: python3 scripts/informe_vs_csv.py
      - run: python3 scripts/manifiesto.py --verificar

  suite:
    name: suite (el codigo funciona)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # WeasyPrint necesita Pango/Cairo nativos. Sin esto el import falla con un
      # error de ctypes que no lo menciona.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8 fonts-dejavu-core

      - run: |
          python -m pip install --upgrade pip
          pip install -r fase0/requirements.txt

      - run: python -m fase0.fixtures.generar

      # Nada de esto toca la red: fixture + clasificador por reglas. Por eso
      # corre en un fork y en un PR de afuera.
      - run: python -m unittest discover -s fase0/tests -t . -v
      - run: bash scripts/control_positivo_suite.sh

      - run: |
          python -m fase0.pipeline fase0/fixtures/brief_ejemplo.json \
            --dry-run fase0/fixtures/ads_archive_sample.json \
            --salida artefactos --pdf

      - run: |
          python scripts/modelo_costo_arq3.py
          python scripts/sensibilidad_infra_y_equipo.py

      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-ejemplo
          path: artefactos/
          retention-days: 14

  deps-pins:
    name: deps-pins (CVEs en lo que pinneamos) - BLOQUEANTE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `--no-deps` audita EXACTAMENTE los 3 pines de requirements.txt.
      #
      # El `|| true` va sobre pip-audit y NO sobre el porton, y no relaja nada: el
      # exit code de pip-audit vale 1 para un advisory, para un error del servicio
      # y para un crash, asi que se descarta a proposito y decide el color del job
      # scripts/gate_deps.py, leyendo el informe. Sin `--strict`: el gate ya trata
      # una dependencia saltada como respuesta parcial y ademas dice CUAL.
      - run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: auditar los 3 pines directos
        run: |
          mkdir -p informe-deps
          pip-audit -r fase0/requirements.txt --no-deps \
            --timeout 60 --format json -o informe-deps/pins.json || true
          python3 scripts/gate_deps.py informe-deps/pins.json

      # Sin publicar el informe es invisible: nadie del equipo tiene herramientas
      # para abrir el log de una corrida, y eso fue exactamente lo que dejo la
      # causa del rojo en NO MEDIDO durante todo un turno.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-pins-informe
          path: informe-deps/pins.json
          retention-days: 14

  deps-arbol:
    name: deps-arbol (CVEs en el arbol transitivo) - BLOQUEANTE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Sin `--no-deps`: el arbol completo. weasyprint arrastra Pillow, tinycss2,
      # cssselect2, pyphen, fonttools, pydyf y cffi; pydantic arrastra
      # pydantic-core, annotated-types y typing-extensions, y NINGUNO esta
      # pinneado. El informe dice "pins exactos" y eso vale para los 3 directos:
      # el resto flota. Su rojo NO se arregla como el de deps-pins.
      - run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: auditar el arbol completo
        run: |
          mkdir -p informe-deps
          pip-audit -r fase0/requirements.txt \
            --timeout 60 --format json -o informe-deps/arbol.json || true
          python3 scripts/gate_deps.py informe-deps/arbol.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-arbol-informe
          path: informe-deps/arbol.json
          retention-days: 14

  secretos:
    name: secretos (historial completo) - BLOQUEANTE
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 NO es opcional: con profundidad 1 un secreto commiteado y
      # borrado despues sigue vivo en el historial y el escaneo lo da por limpio.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # VERDE ajeno en cuatro corridas seguidas sobre los 30 commits. Es el unico
      # control de este repo que mira el historial y no el arbol.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
